<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" preserveAspectRatio="none">
  <!-- Textura del rotulador (src/styles/highlighter.css). Pinta en el color del
       papel (#C5C7D6, --c-panel-bg) los bordes irregulares que el trazo no
       llega a cubrir. Se repite en horizontal sin costuras. Sin vetas de tinta
       seca desde el 05-10-2026 (Luna): el color del trazo es uniforme. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-opacity="1"/>
      <stop offset="0.22" stop-opacity="0"/>
      <stop offset="0.8" stop-opacity="0"/>
      <stop offset="1" stop-opacity="1"/>
    </linearGradient>
    <filter id="ragged" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.05" numOctaves="5" seed="7" stitchTiles="stitch" result="noise"/>
      <feComposite in="SourceGraphic" in2="noise" operator="arithmetic" k1="0" k2="1" k3="1.2" k4="-0.72" result="mix"/>
      <feComponentTransfer in="mix" result="cut">
        <feFuncA type="linear" slope="6" intercept="-2.4"/>
      </feComponentTransfer>
      <feFlood flood-color="#C5C7D6"/>
      <feComposite in2="cut" operator="in"/>
    </filter>
  </defs>
  <rect width="400" height="100" fill="url(#edge)" filter="url(#ragged)"/>
</svg>
